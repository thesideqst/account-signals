command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - '8000'

env:
  - name: CATALOG
    value: workspace
  - name: SCHEMA
    value: account_signals_dev
  # Lets the app run the briefing job on demand for a queued topic.
  - name: BRIEFING_JOB_ID
    value: '175641655518601'
  # Lets the app read Unity Catalog as well as Postgres, so the write-back can
  # be shown from both ends.
  - name: DATABRICKS_WAREHOUSE_ID
    value: c183f02d121f496a
  - name: LAKEBASE_ENDPOINT
    value: projects/account-signals-dev/branches/production/endpoints/primary
  # Lakebase injects PGHOST / PGDATABASE / PGUSER / PGPASSWORD / PGPORT when a
  # postgres resource is attached to the app. No connection string is stored here.
