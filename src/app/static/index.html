<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>account_signals</title>
<style>
  :root{--bg:#0e1317;--card:#161d22;--card2:#1b242a;--ink:#e4eaee;--soft:#93a2ac;
        --line:#2a343b;--accent:#46c6ce;--warm:#e0a05c;--good:#5fbf8f;--bad:#e0605c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.62 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:820px;margin:0 auto;padding:44px 24px 90px}
  h1{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);
     font-weight:600;margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:24px;margin-bottom:18px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--soft);
        margin-bottom:16px;font-variant-numeric:tabular-nums;align-items:center}
  .meta b{color:var(--ink);font-weight:600}
  .pill{display:inline-block;background:#0f2a2d;color:var(--accent);border-radius:4px;
        padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.05em}
  .pill.stale{background:#2e2114;color:var(--warm)}
  h2{font-size:26px;line-height:1.16;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--soft);margin:0 0 18px;font-size:13.5px}
  ul.take{margin:0 0 20px;padding-left:20px;color:#cfdae1}
  ul.take li{margin-bottom:7px}
  audio{width:100%}
  details{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
  summary{cursor:pointer;color:var(--soft);font-size:13px}
  summary:hover{color:var(--ink)}
  #script{margin-top:14px;white-space:pre-wrap;color:#c8d3da;font-size:14.5px}
  .err{color:var(--bad)}
  button{background:var(--accent);color:#062224;border:0;border-radius:7px;
         padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button[disabled]{opacity:.45;cursor:default}
  button.stop{background:var(--bad);color:#2a0d0c}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  h3{font-size:15px;margin:0 0 4px}
  .qs{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
  .q{background:var(--card2);border:1px solid var(--line);border-radius:8px;
     padding:16px;margin-bottom:12px}
  .qtext{font-weight:600;margin-bottom:4px}
  .qwhy{color:var(--soft);font-size:12.5px;margin-bottom:12px}
  .qrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .score{font-weight:700;font-variant-numeric:tabular-nums}
  .said{margin-top:10px;font-size:13px;color:var(--soft);font-style:italic;
        border-left:2px solid var(--line);padding-left:10px}
  .verdict{margin-top:10px;font-size:13.5px;color:#cfdae1}
  .teach{margin-top:10px;font-size:13.5px;color:#cfdae1;background:#12201f;
         border-left:2px solid var(--good);padding:10px 12px;border-radius:0 6px 6px 0}
  .epitem{cursor:pointer}
  .epitem:hover{background:#1b242a}
  .missed{margin-top:8px;font-size:13px;color:var(--warm)}
  input[type=text]{flex:1;min-width:220px;background:var(--card2);color:var(--ink);
        border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13.5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;
        font-variant-numeric:tabular-nums;margin-top:10px}
  th{text-align:left;color:var(--soft);font-weight:600;padding:0 10px 6px 0;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:6px 10px 6px 0;border-bottom:1px solid #202930;color:#c8d3da}
  .layer{color:var(--accent);font-weight:700;letter-spacing:.06em;font-size:11px}
  .ep{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
      border-bottom:1px solid #202930;font-size:13.5px}
  .ep span{color:var(--soft);font-size:12.5px;white-space:nowrap}
  .queue li{margin-bottom:6px;color:#cfdae1}
</style>

<main>
  <h1>account_signals</h1>
  <div id="app" class="card">Loading…</div>
  <div id="extras"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let ACCT = null, BRIEFING = null;

const fmtAge = (iso) => {
  if (!iso || iso === "None") return { text: "unknown", stale: true };
  const hrs = (Date.now() - new Date(iso).getTime()) / 36e5;
  if (isNaN(hrs)) return { text: "unknown", stale: true };
  if (hrs < 1)  return { text: "just now", stale: false };
  if (hrs < 24) return { text: `${Math.round(hrs)}h ago`, stale: false };
  const d = Math.round(hrs / 24);
  return { text: `${d}d ago`, stale: d > 2 };
};

async function load() {
  const app = $("#app");
  try {
    const accounts = await (await fetch("/api/accounts")).json();
    if (!accounts.length) { app.textContent = "No briefings yet."; return; }
    ACCT = accounts[0].account_id;

    const res = await fetch(`/api/briefing/${ACCT}`);
    const b = await res.json();
    if (!res.ok) throw new Error(b.detail || res.statusText);
    BRIEFING = b;

    const mins = (b.word_count / 153).toFixed(1);
    const lineage = parse(b.lineage, {});
    const freshest = (lineage.bronze || [])
      .map(r => r.last_ingested).filter(Boolean).sort().reverse()[0];
    const age = fmtAge(freshest);

    app.innerHTML = `
      <div class="meta">
        <span class="pill">${b.mode_label || b.mode}</span>
        <span><b>${b.account_id}</b></span>
        <span>quarter ending <b>${b.period_end}</b></span>
        <span><b>${b.word_count}</b> words · ~${mins} min</span>
        <span class="pill ${age.stale ? "stale" : ""}">data ${age.text}</span>
      </div>
      <h2>${b.episode_title || "Today's briefing"}</h2>
      <p class="sub">${b.mode_reason || ""}</p>
      ${list(parse(b.takeaways, []))}
      <audio controls preload="none" src="/api/audio/${ACCT}"></audio>
      <details><summary>Read the transcript</summary><div id="script"></div></details>
      <div class="qs" id="qs"></div>`;
    $("#script").textContent = b.script_text;

    renderQuestions(parse(b.questions, []));
    renderExtras(lineage);
  } catch (e) {
    app.innerHTML = `<span class="err">Could not load: ${e.message}</span>`;
  }
}

const parse = (raw, fallback) => {
  try { return typeof raw === "string" ? JSON.parse(raw) : (raw ?? fallback); }
  catch { return fallback; }
};
const list = (items) => items.length
  ? `<ul class="take">${items.map(t => `<li>${t}</li>`).join("")}</ul>` : "";

// ---------- comprehension questions, graded as soon as you answer ----------
function renderQuestions(questions) {
  const wrap = $("#qs");
  if (!questions.length) { wrap.innerHTML = ""; return; }
  wrap.innerHTML = `<h3>Three questions</h3>
    <p class="sub">Answer out loud. Each one is graded the moment you finish.</p>
    ${questions.map((q, i) => `
      <div class="q" data-i="${i}">
        <div class="qtext">${i + 1}. ${q.question || ""}</div>
        <div class="qwhy">${q.why_it_matters || ""}</div>
        <div class="qrow">
          <button class="rec">Answer</button>
          <span class="state"></span>
          <span class="score"></span>
        </div>
        <div class="said"></div>
        <div class="verdict"></div>
        <div class="missed"></div>
      </div>`).join("")}
    <div class="qrow" style="margin-top:16px">
      <input type="text" id="topic" placeholder="Something else you want covered? Add it to the queue">
      <button class="ghost" id="addtopic">Add topic</button>
    </div>`;

  questions.forEach((q, i) => wireAnswer(wrap.querySelector(`.q[data-i="${i}"]`), q, i));
  $("#addtopic").onclick = async () => {
    const input = $("#topic");
    if (!input.value.trim()) return;
    await postTopic(input.value, "manual");
    input.value = "";
    loadQueue();
  };
}

function wireAnswer(el, q, i) {
  const btn = el.querySelector(".rec"), state = el.querySelector(".state");
  const score = el.querySelector(".score"), verdict = el.querySelector(".verdict");
  const missed = el.querySelector(".missed"), said = el.querySelector(".said");
  let recorder = null, chunks = [];

  btn.onclick = async () => {
    if (recorder && recorder.state === "recording") {
      state.textContent = "grading…"; btn.disabled = true; recorder.stop(); return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream); chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const form = new FormData();
        form.append("audio", new Blob(chunks, { type: "audio/webm" }), "a.webm");
        form.append("briefing_id", BRIEFING.briefing_id);
        form.append("question_index", i);
        form.append("question", q.question || "");
        form.append("expected", (q.expected_points || []).join("; "));
        try {
          const r = await fetch(`/api/answer/${ACCT}`, { method: "POST", body: form });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || r.statusText);
          state.textContent = "";
          // Show it back to them: transcription is imperfect, and a low score
          // for a misheard word is worth being able to see.
          said.textContent = d.transcript ? `You said: “${d.transcript}”` : "";
          const s = d.score;
          score.textContent = s == null ? "" : `${s}%`;
          score.style.color = s == null ? "" : (s >= 70 ? "var(--good)" : s >= 40 ? "var(--warm)" : "var(--bad)");
          verdict.textContent = d.verdict || "";
          // One click turns a gap into a future episode.
          if (d.teach) {
            const t = document.createElement("div");
            t.className = "teach";
            t.textContent = d.teach;
            verdict.after(t);
          }
          if (d.missed) {
            missed.innerHTML = `Missed: ${d.missed}
              <button class="ghost" style="margin-left:8px;padding:4px 10px;font-size:12px">
                Cover this next time</button>`;
            missed.querySelector("button").onclick = async (ev) => {
              ev.target.disabled = true;
              await postTopic(d.missed, "missed_question");
              ev.target.textContent = "Queued";
              loadQueue();
            };
          }
        } catch (err) {
          state.textContent = ""; verdict.innerHTML = `<span class="err">${err.message}</span>`;
        }
        btn.disabled = false; btn.textContent = "Answer again"; btn.classList.remove("stop");
      };
      recorder.start();
      btn.textContent = "Stop"; btn.classList.add("stop"); state.textContent = "recording…";
    } catch (e) {
      verdict.innerHTML = `<span class="err">Microphone unavailable: ${e.message}</span>`;
    }
  };
}

async function postTopic(topic, origin) {
  const form = new FormData();
  form.append("topic", topic);
  form.append("origin", origin);
  await fetch(`/api/topic/${ACCT}`, { method: "POST", body: form });
}

// ---------- lineage, freshness, queue, past episodes ----------
function renderExtras(lineage) {
  const bronze = lineage.bronze || [], silver = lineage.silver || [];
  $("#extras").innerHTML = `
    <div class="card">
      <h3>Where this episode came from</h3>
      <p class="sub">Every source behind today's script, and how fresh it was.</p>
      <div class="layer">BRONZE — raw, as collected</div>
      <table><thead><tr><th>Source</th><th>Rows</th><th>Last pulled</th></tr></thead>
        <tbody>${bronze.map(r => {
          const a = fmtAge(r.last_ingested);
          return `<tr><td>${r.source}</td><td>${(r.rows ?? 0).toLocaleString()}</td>
                  <td style="color:${a.stale ? "var(--warm)" : "var(--soft)"}">${a.text}</td></tr>`;
        }).join("")}</tbody></table>
      <div class="layer" style="margin-top:18px">SILVER — cleaned, and the arithmetic</div>
      <table><thead><tr><th>Table</th><th>Used</th><th>What for</th></tr></thead>
        <tbody>${silver.map(r =>
          `<tr><td>${r.table}</td><td>${r.used ?? 0}</td><td>${r.note || ""}</td></tr>`).join("")}</tbody></table>
      <div class="layer" style="margin-top:18px">GOLD — this episode</div>
      <table><tbody>
        <tr><td>Mode</td><td>${(lineage.gold || {}).mode || "—"} — ${(lineage.gold || {}).mode_reason || ""}</td></tr>
        <tr><td>Model</td><td>${(lineage.gold || {}).model || "—"}</td></tr>
        <tr><td>Prompt size</td><td>${((lineage.gold || {}).prompt_chars || 0).toLocaleString()} characters</td></tr>
      </tbody></table>
    </div>
    <div class="card"><h3>Queued topics</h3>
      <p class="sub">On a day with no earnings and no real news, these choose the subject.</p>
      <ul class="queue" id="queue"><li style="color:var(--soft)">Loading…</li></ul></div>
    <div class="card"><h3>Past episodes</h3><div id="episodes"></div></div>`;
  loadQueue();
  loadEpisodes();
}

async function loadQueue() {
  const el = $("#queue"); if (!el) return;
  try {
    const rows = await (await fetch(`/api/topics/${ACCT}`)).json();
    el.innerHTML = rows.length
      ? rows.map(r => `<li data-id="${r.request_id}">${r.topic}
          <span style="color:var(--soft);font-size:12px"> — ${r.origin.replace("_", " ")}</span>
          <button class="ghost gen" style="margin-left:8px;padding:3px 9px;font-size:12px">
            Make this episode now</button></li>`).join("")
      : `<li style="color:var(--soft)">Nothing queued. Add one above, or queue whatever you miss.</li>`;
    el.querySelectorAll(".gen").forEach(btn => {
      btn.onclick = async (ev) => {
        const id = ev.target.closest("li").dataset.id;
        ev.target.disabled = true; ev.target.textContent = "Generating…";
        const form = new FormData(); form.append("request_id", id);
        try {
          const r = await fetch(`/api/generate/${ACCT}`, { method: "POST", body: form });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || r.statusText);
          ev.target.textContent = "Started — takes a few minutes";
        } catch (e) {
          ev.target.textContent = "Retry";
          ev.target.disabled = false;
          const msg = document.createElement("div");
          msg.className = "err";
          msg.style.cssText = "font-size:12.5px;margin-top:6px";
          msg.textContent = e.message;
          ev.target.closest("li").appendChild(msg);
        }
      };
    });
  } catch { el.innerHTML = `<li class="err">Could not load the queue.</li>`; }
}

async function loadEpisodes() {
  const el = $("#episodes"); if (!el) return;
  try {
    const rows = await (await fetch(`/api/episodes/${ACCT}`)).json();
    el.innerHTML = rows.length
      ? rows.map(r => `<div class="ep epitem" data-id="${r.briefing_id}">
          <div>${r.episode_title || "(untitled)"}</div>
          <span>${r.mode_label || ""} · ${fmtAge(r.generated_at).text}</span></div>`).join("")
        + `<div id="epdetail"></div>`
      : `<div style="color:var(--soft)">This is the first episode.</div>`;
    el.querySelectorAll(".epitem").forEach(row => {
      row.onclick = () => openEpisode(row.dataset.id);
    });
  } catch { el.innerHTML = `<span class="err">Could not load past episodes.</span>`; }
}

async function openEpisode(id) {
  const box = $("#epdetail");
  box.innerHTML = `<div style="color:var(--soft);padding:12px 0">Loading…</div>`;
  try {
    const e = await (await fetch(`/api/episode/${id}`)).json();
    const answers = e.answers || [];
    box.innerHTML = `
      <div class="card" style="margin-top:14px;background:var(--card2)">
        <div class="meta">
          <span class="pill">${e.mode_label || ""}</span>
          <span>${fmtAge(e.generated_at).text}</span>
          <span><b>${e.word_count}</b> words</span>
        </div>
        <h3>${e.episode_title || "(untitled)"}</h3>
        ${list(parse(e.takeaways, []))}
        <audio controls preload="none" src="/api/audio-by-id/${id}"></audio>
        <details><summary>Read the transcript</summary>
          <div id="oldscript" style="white-space:pre-wrap;margin-top:12px;color:#c8d3da"></div>
        </details>
        <div style="margin-top:16px">
          <h3>Your answers</h3>
          ${answers.length ? answers.map(a => `
            <div class="q">
              <div class="qtext">${a.question}</div>
              <div class="said">You said: “${a.answer}”</div>
              <div class="qrow" style="margin-top:8px">
                <span class="score" style="color:${a.score >= 70 ? "var(--good)" :
                  a.score >= 40 ? "var(--warm)" : "var(--bad)"}">${a.score ?? "—"}%</span>
                <span style="color:var(--soft);font-size:12.5px">${fmtAge(a.answered_at).text}</span>
              </div>
              <div class="verdict">${a.verdict || ""}</div>
              ${a.missed ? `<div class="teach">${a.missed}</div>` : ""}
            </div>`).join("")
            : `<div style="color:var(--soft)">You did not answer the questions on this one.</div>`}
        </div>
      </div>`;
    $("#oldscript").textContent = e.script_text;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    box.innerHTML = `<span class="err">Could not open that episode: ${err.message}</span>`;
  }
}

load();
</script>
