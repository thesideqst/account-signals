# Bronze -> Silver. Declarative because the dependencies are knowable:
# given these tables, derive those. The pipeline works out the order and
# handles incremental updates. External API calls deliberately live in
# ingest.job.yml instead, where retries and auth are easier to control.
resources:
  pipelines:
    signals:
      name: account_signals_pipeline
      serverless: true
      # Triggered by the jobs rather than running on its own clock: Silver is
      # only worth rebuilding once new Bronze has actually landed.
      continuous: false
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        - file:
            path: ../src/pipelines/xbrl_facts.py
        - file:
            path: ../src/pipelines/xbrl_metrics.py
        - file:
            path: ../src/pipelines/rating_changes.py
        - file:
            path: ../src/pipelines/transcript_turns.py
        - file:
            path: ../src/pipelines/metric_context.py
        # Reads silver_metric_context, so DLT orders it after that table via
        # dlt.read() - no explicit ordering needed here (see
        # src/pipelines/CLAUDE.md, "How a table gets defined and found").
        - file:
            path: ../src/pipelines/cross_account_themes.py
        - file:
            path: ../src/pipelines/macro_context.py
        - file:
            path: ../src/pipelines/daily_signals.py
        - file:
            path: ../src/pipelines/chunk_and_embed.py
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
        embedding_endpoint: ${var.embedding_endpoint}
