# Silver -> Gold. Retrieve, write, narrate.
# Sequential on purpose: each step consumes the previous one's output.
resources:
  jobs:
    briefing:
      name: account_signals_briefing

      environments:
        - environment_key: briefing_env
          spec:
            client: "4"
            dependencies:
              - databricks-vectorsearch
              - mlflow
              - requests
              # tts.py re-grants the app's Postgres read access after syncing
              - psycopg[binary]
              - databricks-sdk

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: llm_endpoint
          default: ${var.llm_endpoint}
        - name: vector_search_endpoint
          default: ${var.vector_search_endpoint}
        # Narration pace. 1.0 measures at ~153 words per minute against the
        # player's own duration, which is normal narration. An earlier 0.8 was
        # set to correct a wpm figure that turned out to be a bad bitrate read.
        - name: tts_speed
          default: "1.0"
        # Created by `databricks postgres create-synced-table`; differs per
        # workspace. Leave blank and the Lakebase copy simply is not refreshed.
        - name: sync_pipeline_id
          default: ${var.sync_pipeline_id}
        # Set by the app when a rep asks for a queued topic right now, rather
        # than waiting for a quiet day.
        - name: force_mode
          default: ""
        - name: force_topic
          default: ""
        # Which account this run covers. One run per account; the scheduled
        # briefing runs for the default and the others are triggered per account.
        - name: account
          default: "NVDA"

      tasks:
        # Pull the structured deltas plus the prose that matters for this mode.
        - task_key: retrieve
          environment_key: briefing_env
          spark_python_task:
            python_file: ../src/briefing/retrieve.py

        # Choose the mode, then write the script. force_mode and force_topic let
        # the app turn a queued topic into an episode without waiting for a quiet
        # day; both are empty on a normal scheduled run.
        - task_key: synthesize
          depends_on:
            - task_key: retrieve
          environment_key: briefing_env
          spark_python_task:
            python_file: ../src/briefing/synthesize.py
            parameters:
              - "{{job.parameters.catalog}}"
              - "{{job.parameters.schema}}"
              - "{{job.parameters.llm_endpoint}}"
              - "{{job.parameters.force_mode}}"
              - "{{job.parameters.force_topic}}"
              - "{{job.parameters.account}}"

        # External TTS -> MP3 into the UC Volume, then refresh what the app reads.
        - task_key: narrate
          depends_on:
            - task_key: synthesize
          environment_key: briefing_env
          spark_python_task:
            python_file: ../src/briefing/tts.py
            parameters:
              - "{{job.parameters.catalog}}"
              - "{{job.parameters.schema}}"
              - "{{job.parameters.tts_speed}}"
              - "{{job.parameters.sync_pipeline_id}}"
              - "{{job.parameters.account}}"

      # 05:45 ET, weekdays: 45 minutes after ingest starts, which is comfortably
      # longer than the ~4 minutes a briefing takes plus the ingest itself. Late
      # enough that the data is in, early enough for a 6am commute.
      schedule:
        quartz_cron_expression: '0 45 5 ? * MON-FRI'
        timezone_id: America/New_York
        pause_status: UNPAUSED
